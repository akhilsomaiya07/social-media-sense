# One-time gallery publication for the maintainer's private review branch only.
# Never runs for outside pull requests and never writes to main.
name: Publish reviewed screenshot candidate
on:
  push:
    branches:
      - docs/refresh-screenshot-gallery-20261026
    paths:
      - scripts/capture-showcase.mjs
      - README.md
      - docs/SCREENSHOTS.md
      - .github/workflows/publish-screenshot-refresh.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: curated-screenshot-refresh
  cancel-in-progress: false
jobs:
  gallery:
    if: github.repository == 'akhilsomaiya07/social-media-sense' && github.ref == 'refs/heads/docs/refresh-screenshot-gallery-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: docs/refresh-screenshot-gallery-20261026
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Capture synthetic check-in and tools
        run: npm run screenshots
      - name: Stage complete gallery for PR review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const from='artifacts/screenshots', to='docs/screenshots';
          const manifest=JSON.parse(await fs.readFile(path.join(from,'manifest.json'),'utf8'));
          const gallery=manifest.captures.filter(c=>!c.file.startsWith('report-'));
          if(gallery.length!==18)throw new Error('Expected 18 complete gallery images; found '+gallery.length);
          if(!gallery.some(c=>c.file==='sleep-tracker-seven-night-summary.png'))throw new Error('Missing Seven-Night Sleep Summary');
          for(const item of gallery) {
            if(!/^[a-z0-9-]+\.png$/.test(item.file))throw new Error('Unexpected image file '+item.file);
            await fs.copyFile(path.join(from,item.file),path.join(to,item.file));
          }
          for(const obsolete of ['sleep-shield.png','sleep-shield-tracking.png','homepage.webp']) {
            await fs.rm(path.join(to,obsolete),{force:true});
          }
          await fs.writeFile(path.join(to,'manifest.json'),JSON.stringify({
            fixture:manifest.fixture,research:manifest.research,browser:manifest.browser,
            sourceCommit:process.env.GITHUB_SHA,
            captures:gallery
          },null,2)+'\n');
          NODE
      - name: Commit screenshot updates to review branch (not main)
        run: |
          git add -A docs/screenshots/
          if git diff --cached --quiet; then
            echo "Gallery unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: refresh actual browser screenshots for public gallery"
            git push origin HEAD:docs/refresh-screenshot-gallery-20261026
          fi
      - name: Attach capture review artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: gallery-candidates-${{ github.run_id }}
          path: |
            artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
