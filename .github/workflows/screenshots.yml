# Screenshot artifacts only; documentation publication remains a reviewed change.
name: Screenshot review
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/capture-showcase.mjs'
      - 'scripts/test-motion.mjs'
      - 'scripts/test-age*.mjs'
      - 'scripts/*routing*.mjs'
      - 'cloudflare/worker.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    # A measured cold npm ci took 7m; retain bounded time for the browser suites.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: browser
        run: npx playwright install --with-deps chromium
      - id: build
        run: npm run build
      - name: Check unit regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test
      - name: Check motion and accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run test:motion
      - name: Check routes and Worker fallback
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run test:routing
      - name: Check age validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run test:age
      - name: Check Cloudflare bundle without deploying
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:cloudflare
      - name: Capture local application
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run screenshots
      - name: Upload screenshots and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/screenshots/
            artifacts/motion/
            artifacts/routing/
            artifacts/age/
          if-no-files-found: warn
          retention-days: 14
