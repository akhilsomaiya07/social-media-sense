# Screenshot artifacts only; documentation publication remains a reviewed change.
name: Screenshot review
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/capture-showcase.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Capture local application
        run: npm run screenshots
      - name: Upload screenshots and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
