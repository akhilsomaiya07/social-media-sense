# Screenshot artifacts only; documentation publication remains a reviewed change.
name: Screenshot review
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/capture-showcase.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Capture local application
        run: npm run screenshots
      - name: Upload screenshots and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish approved showcase captures to review branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/readme-human-showcase-steps-1-5' && success() }}
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          mkdir -p docs/screenshots
          cp artifacts/screenshots/*.png docs/screenshots/
          cp artifacts/screenshots/manifest.json docs/screenshots/manifest.json
          git add docs/screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh complete five-step screenshot gallery"
          git fetch origin "${REVIEW_BRANCH}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${REVIEW_BRANCH}"
