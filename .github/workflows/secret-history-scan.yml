name: Gitleaks history scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-scan:
    name: Scan available Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch available pull-request head refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
            git fetch --force --no-tags origin \
              '+refs/pull/*/head:refs/remotes/origin/pull/*/head'
          unset auth_header GH_TOKEN
      - name: Record available scan coverage
        shell: bash
        run: |
          set -euo pipefail
          branch_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -Ev '/pull/[0-9]+/head$|/HEAD$' | wc -l | tr -d '[:space:]')"
          tag_refs="$(git for-each-ref --format='%(refname)' refs/tags/ | wc -l | tr -d '[:space:]')"
          pull_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin/pull/ | grep -c '/head$' || true)"
          commit_count="$(git rev-list --count --all)"
          {
            echo '## Gitleaks history coverage'
            echo
            echo "Available refs: ${branch_refs} branch refs, ${tag_refs} tags, ${pull_refs} pull-request head refs."
            echo "Unique reachable commits: ${commit_count}."
            echo 'The scan covers all commits reachable from these refs. Deleted or otherwise inaccessible refs are outside this scan.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version
      - name: Scan history and report redacted findings
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          scan_log="$RUNNER_TEMP/gitleaks-cli.log"
          trap 'rm -f "$report" "$scan_log"' EXIT
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact \
            --no-banner \
            --max-archive-depth 2 \
            --max-decode-depth 1 \
            --report-format json \
            --report-path "$report" \
            --exit-code 0 \
            . >"$scan_log" 2>&1
          scan_status=$?
          set -e
          if [[ "$scan_status" -ne 0 || ! -s "$report" ]]; then
            echo 'Gitleaks could not complete the scan. Scanner output was kept off the workflow log.' >&2
            exit 2
          fi
          python3 - "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections
          import json
          import re
          import sys
          from pathlib import Path

          report_path, summary_path = sys.argv[1:3]
          try:
              findings = json.loads(Path(report_path).read_text(encoding='utf-8'))
          except Exception:
              print('Gitleaks returned an unreadable report; no finding values were printed.', file=sys.stderr)
              raise SystemExit(2)
          if not isinstance(findings, list):
              print('Gitleaks returned an unexpected report format; no finding values were printed.', file=sys.stderr)
              raise SystemExit(2)
          counts = collections.Counter(str(item.get('RuleID') or 'unknown-rule') for item in findings)
          lines = ['## Gitleaks findings', '', f'Potential findings: **{len(findings)}**. Secret values are not included.']
          if counts:
              lines += ['', 'Counts by rule category:']
              lines += [f'- `{rule}`: {count}' for rule, count in sorted(counts.items())]
              lines += ['', 'Locations (file, line, and abbreviated commit only):']
              for item in findings:
                  rule = re.sub(r'[^A-Za-z0-9_.-]', '?', str(item.get('RuleID') or 'unknown-rule'))
                  file_name = re.sub(r'[^A-Za-z0-9_./-]', '?', str(item.get('File') or 'unknown-file'))
                  line = item.get('StartLine') if isinstance(item.get('StartLine'), int) else '?'
                  commit = str(item.get('Commit') or 'unknown')
                  commit = commit[:12] if re.fullmatch(r'[0-9a-fA-F]{7,40}', commit) else 'unknown'
                  lines.append(f'- `{rule}` at `{file_name}:{line}` (commit `{commit}`)')
          Path(summary_path).open('a', encoding='utf-8').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          if findings:
              raise SystemExit(1)
          PY
